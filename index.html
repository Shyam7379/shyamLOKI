    <!--
      The hero still is the largest contentful paint, and it is rendered by React
      rather than sitting in the markup — so it is preloaded here to start the
      request during HTML parse instead of after the bundle executes.

      Two preloads, each gated by the same breakpoint the <picture> in Hero.tsx
      uses, so exactly one of them ever matches and the file that is fetched is
      the file that is shown. (An imagesrcset/imagesizes preload was tried first
      and did not hold: the preload scanner resolved 100vw against a different
      viewport than the <img> did, picked the phone poster on a desktop, and the
      desktop poster was downloaded a second time.)

      Deliberately no <link rel="preload" as="video">: video preload is not
      reliably supported, and pulling several MB of mp4 at parse time would
      compete with the poster for bandwidth and push the LCP out.
    -->
    <link
      rel="preload"
      as="image"
      href="/media/hero/hero-poster.webp"
      media="(min-width: 48rem)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/media/hero/hero-poster-mobile.webp"
      media="(max-width: 47.999rem)"
      fetchpriority="high"
    />
